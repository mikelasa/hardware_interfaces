# Config for wrench_calib_recorder — overnight bias data collection.
# Cameras and gripper are disabled; max speed is reduced for safe unattended operation.

data_folder: "/home/robotlab/data/real/wrench_calibration_test"

mock_hardware: false
bimanual: false
num_cameras: 1

run_robot_thread: True
run_wrench_thread: True
run_rgb_thread: False
run_eoat_thread: false
eoat_selection: "FRANKA_GRIPPER"
teleop: False
plot_rgb: False
plot_wrench: False

rgb_buffer_size: 1
robot_buffer_size: 1200
wrench_buffer_size: 1200
eoat_buffer_size: 1
robot_selection: "FRANKA"
camera_selection: ["REALSENSE"]
force_sensing_mode: "JOINT_SENSORS"
controller_selection: "IMPEDANCE_CONTROLLER"
teleop_device: "none"
low_damping: [2.0, 2.0, 2.0, 0.1, 0.1, 0.1]
output_rgb_hw: [224, 224]

joint_sensor_frequency: 1000
# Higher alpha = less smoothing on the raw wrench stored in wrench_data_0.json.
# The training script averages over the whole 15 s hold, so DC bias is preserved.
wrench_sensor_filter_alpha: 0.1

franka0:
  robot_ip: "172.17.6.164"
  log_size: 50
  tcp_mass: 0.367
  fx_c_load: [0.06, 0.0, 0.04]
  tcp_inertia: [0.00001, 0.0, 0.0,
                0.0, 0.00001, 0.0,
                0.0, 0.0, 0.00001]
  deviation: [10.0, 3.12, 6.283185307179586]
  kDeltaT: 1e-3
  CutoffFrequency: 100
  realtime_config: "enforce"
  controller_mode: "external_controller"
  motion_generator_mode: "joint_velocity"
  setJointImpedance: [3000, 3000, 3000, 2500, 2500, 2000, 2000]
  setCartesianImpedance: [1000, 1000, 1000, 200, 200, 200]
  # Reduced speed for safe unattended overnight operation
  kMaxTranslationalVelocity: 0.20
  kMaxTranslationalAcceleration: 0.8
  kMaxTranslationalJerk: 500
  kMaxRotationalVelocity: 0.20
  kMaxRotationalAcceleration: 0.8
  kMaxRotationalJerk: 500
  robot_interface_config:
    zone_safety_mode: "SAFETY_MODE_TRUNCATE"
    incre_safety_mode: "SAFETY_MODE_STOP"
    operation_mode: "OPERATION_MODE_CARTESIAN"
    max_incre_m: 0.03
    max_incre_rad: 0.2
    max_incre_joint_rad: 0.0628
    # Safe zone [xmin, xmax, ymin, ymax, zmin, zmax] in metres.
    # Derived from measured workspace corners; 3 cm outward margin.
    safe_zone: [0.57, 1.00, -0.40, 0.30, -0.02, 0.29]

impedance_controller0:
  dt: 0.001
  log_to_file: false
  log_file_path: ""
  alert_overrun: false
  compliance6d:
    stiffness: [1500, 1500, 1500, 100, 100, 100] # 
    damping: [46.9, 46.9, 46.9, 10, 10 ,10] # applying critical damping: D = 2*sqrt(K*m)
    nullspace_stiffness: [0, 0, 0, 0, 0, 0, 0]
    nullspace_damping: [0, 0, 0, 0, 0, 0, 0]
    stiction: [0, 0, 0, 0, 0, 0]

gripper_open_preset:
  width: 0.08
  force: 0.0
  duration_ms: 800

gripper_close_preset:
  width: 0.0
  force: 20.0
  duration_ms: 1200
