# Inference
#    plot_rgb: false
#    damping: high damping
#    max_spring_force_magnitude: 50
# Data collection:
#    plot_rgb: true
#    damping: low damping
#    max_spring_force_magnitude: 15
# always check the first few parameters:
data_folder: "/home/robotlab/data/real/demonstration_impacts/E1_minimum_demos/200demos"  # folder to save data
mock_hardware: false
bimanual: false
num_cameras: 1

run_robot_thread: True
run_wrench_thread: True
run_rgb_thread: True
run_eoat_thread: false
eoat_selection: "FRANKA_GRIPPER" # "FRANKA_GRIPPER" or "EOAT"
teleop: false
plot_rgb: false
plot_wrench: false

rgb_buffer_size: 11
robot_buffer_size: 1200 #duplicado ya que los datos se leen el doble de rapido.
wrench_buffer_size: 1200 # reducido porquu la velocidad es de 1Khz 
eoat_buffer_size: 600
robot_selection: "FRANKA"  # "UR_RTDE" or "FRANKA"
camera_selection: ["GOPRO", "REALSENSE"]
force_sensing_mode: "JOINT_SENSORS"
controller_selection: "IMPEDANCE_CONTROLLER"
teleop_device: "GAMEPAD"  # "GAMEPAD", "GELLO" or "none"
low_damping: [2.0, 2.0, 2.0, 0.1, 0.1, 0.1]
output_rgb_hw: [224, 224]

# inner joint sensor frequency (cant be changed for now because buffer synchronization)
joint_sensor_frequency: 1000
wrench_sensor_filter_alpha: 0.05  # Pre-filter on raw joint-sensor wrench (lower=smoother, higher=faster response)

wrench_bias_filter:
  enabled: false
  model_path: "/home/robotlab/data/wrench_bias_models/wrench_bias.bin"


franka0:
  robot_ip: "172.17.6.164"
  log_size: 50
  tcp_mass: 0.0 #0.3
  fx_c_load: [0.0, 0.0, 0.0]
  tcp_inertia: [0.00001, 0.0, 0.0,
                0.0, 0.00001, 0.0,
                0.0, 0.0, 0.00001]
  deviation: [10.0, 3.12, 6.283185307179586]
  kDeltaT: 1e-3
  CutoffFrequency: 100
  realtime_config: "enforce" # ignore or enforce
  controller_mode: "external_controller" # "joint_impedance" or "cartesian_impedance" or "external_controller"
  motion_generator_mode: "joint_velocity" # "joint_position" or "joint_velocity" or "cartesian_position" or "cartesian_velocity"
  setJointImpedance: [3000, 3000, 3000, 2500, 2500, 2000, 2000]
  setCartesianImpedance: [1000, 1000, 1000, 200, 200, 200]
  kMaxTranslationalVelocity: 0.25
  kMaxTranslationalAcceleration: 1.0
  kMaxTranslationalJerk: 500
  kMaxRotationalVelocity: 0.25
  kMaxRotationalAcceleration: 1.0
  kMaxRotationalJerk: 500
  robot_interface_config:
    zone_safety_mode: "SAFETY_MODE_TRUNCATE"
    incre_safety_mode: "SAFETY_MODE_STOP"
    operation_mode: "OPERATION_MODE_CARTESIAN"
    max_incre_m: 0.03
    max_incre_rad: 0.2
    max_incre_joint_rad: 0.0628
    safe_zone: [-0.5, 0.7, -0.9, -0.2, 0.2, 0.8]

gripper_open_preset:
  width: 0.08       # m — fully open
  force: 0.0        # N — 0 means move(), not grasp()
  duration_ms: 800  # ms to reach target

gripper_close_preset:
  width: 0.0        # m — fully closed
  force: 20.0       # N — triggers grasp() in FrankaGripper
  duration_ms: 1200 # ms to reach target

franka_gripper0:
  robot_ip: "172.17.6.164"       # same IP as the arm
  move_speed: 0.1                # m/s
  grasp_speed: 0.05              # m/s — slower for grasping
  grasp_epsilon_inner: 0.005     # m
  grasp_epsilon_outer: 0.005     # m
  position_threshold: 0.001      # m — min change to issue a new command
  force_threshold: 0.5           # N — above this uses grasp() instead of move()
  js_interface_config:
    num_joints: 1
    range_safety_mode: "SAFETY_MODE_TRUNCATE"
    incre_safety_mode: "SAFETY_MODE_NONE"
    max_incre: 0.08
    safe_zone: [0.0, 0.08]       # gripper width range in meters

realsense0: # Intel Realsense D405
  width: 848
  height: 480
  framerate: 60
  enable_color: true
  enable_depth: false
  align_depth_to_color: false

impedance_controller0:
  dt: 0.001
  log_to_file: true
  log_file_path: "/home/robotlab/data/controller_log/impedance_controller.log"
  alert_overrun: false
  compliance6d:
    #stiffness: [1500, 1500, 1500, 100, 100, 100] # 
    #damping: [46.9, 46.9, 46.9, 10, 10 ,10] # applying critical damping: D = 2*sqrt(K*m)
    stiffness: [800, 800, 800, 50, 50, 50] # 
    damping: [34, 34, 34, 8.56, 8.56 , 8.56] # applying critical damping: D = 2*sqrt(K*m)
    #stiffness: [500, 500, 500, 50, 50, 50] # 
    #damping: [27, 27, 27, 5, 5 ,5]
    nullspace_stiffness: [0, 0, 0, 0, 0, 0, 0]
    nullspace_damping: [0, 0, 0, 0, 0, 0, 0]
    stiction: [0, 0, 0, 0, 0, 0] #stationary friction model

spacemouse0:
  vendor_id: 0x256f
  product_id: 0xc635
  device_index: 0
  translation_scale: 0.8
  rotation_scale: 0.1
  dead_zone: 0.05
  enable_filtering: true
  filter_alpha: 0.3
  update_rate_hz: 1000

usbcam0:
  device_name: "/dev/video7"
  frame_width: 640
  frame_height: 480
  crop_rows: [-1, -1]
  crop_cols: [-1, -1]
  fps: 30
  manual_exposure: true
  exposure_absolute: 200  # 100 x 100us = 10ms = 1/100s (fits in 16.7ms frame, one 50Hz half-cycle)
  cv_num_threads: 8

realsense1:
  width: 848
  height: 480
  framerate: 30
  enable_color: true
  enable_depth: false
  align_depth_to_color: false

gopro0:
  #device_name: "/dev/video0"
  device_name: "/dev/v4l/by-id/usb-Elgato_Cam_Link_4K_A29YB55031069F-video-index0"
  # device_name: "/dev/v4l/by-id/usb-Elgato_Elgato_HD60_X_A00XB320216MTR-video-index0" # right arm
  frame_width: 1920
  frame_height: 1080
  crop_rows: [0, 1080] # set to negative to disable cropping
  crop_cols: [420, 1500]
  fps: 60
  cv_num_threads: 8

gamepad0:
  device_path: "/dev/input/js0"
  deadzone_stick: 0.12
  deadzone_trigger: 0.08
  update_rate_hz: 1000
  translation_scale: 1e-4
  rotation_scale: 2.5e-4
  input_filter_alpha: 0.15     # EMA smoothing on stick input (0=frozen, 1=raw, lower=smoother)
  rumble_force_min_n: 9         # Force (N) to start rumble — matches plot display
  rumble_force_max_n: 14         # Force (N) at max vibration intensity
  rumble_duration_ms: 200        # Duration per rumble pulse (ms)
  rumble_refresh_ms: 150.0       # Min time between rumble refreshes (ms)
  precision_scale: 0.4           # Speed multiplier when RB held (0.1 = 10x slower)

gello0:
  port: "/dev/ttyACM0"
  baudrate: 1000000
  joint_ids: [1, 2, 3, 4, 5, 6, 7]
  joint_offsets: [-3.1416, 3.1416, 3.1416, 4.7124, -3.1416, 4.7124, 4.7124]
  joint_signs: [1, 1, 1, 1, 1, -1, 1]
  gripper_id: 8
  gripper_open_rad: 1.7604
  gripper_close_rad: 1.0308
  smoothing_alpha: 0.2
  read_rate_hz: 500

gello_teleop:
  low_pass_alpha: 0.1              # Position/orientation filter (lower=smoother, higher=faster)
  alignment_threshold_rad: 0.2   # Max per-joint error to consider GELLO aligned (rad)
  home_joints: [0.0, 0.0, 0.0, -1.5708, 0.0, 1.5708, 0.0]  # Reference pose for 2π correction